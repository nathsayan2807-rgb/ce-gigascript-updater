name: Check Gigascript upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-gigascript
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate upstream
        run: python scripts/update_upstream.py
      - name: Commit changes if upstream changed
        run: |
          if [ -z "$(git status --porcelain -- dist upstream-state.json)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist upstream-state.json
          git commit -m "Refresh upstream Gigascript snapshot"
          git push
